# nginx's RTMP server in the stream relay (relay.py starts it). The headless OBS on this machine streams here, to
# rtmp://127.0.0.1:1936/live with the key "wtd", and relay.py's ffmpegs play it from here to send it on to Twitch and
# YouTube. The container shares the host's network, and only this machine can publish or play.
include /etc/nginx/modules-enabled/*.conf;

daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

rtmp {
    # The relay logs what matters itself; nginx can't write /var/log as htsadmin anyway.
    access_log off;

    server {
        listen 127.0.0.1:1936;
        chunk_size 4096;

        application live {
            live on;
            record off;
            # Each destination's picture starts on a keyframe.
            wait_key on;
            # OBS reconnects by itself when its connection here goes quiet.
            drop_idle_publisher 10s;
            allow publish 127.0.0.1;
            deny publish all;
            allow play 127.0.0.1;
            deny play all;
        }
    }
}
